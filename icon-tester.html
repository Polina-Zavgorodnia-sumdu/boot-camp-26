<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>УкрДані — Тестер іконок</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #008080;
    font-family: "MS Sans Serif", "Microsoft Sans Serif", Arial, sans-serif;
    font-size: 11px;
    min-height: 100vh;
    padding: 12px;
  }

  /* ── Win98 window ── */
  .window {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    box-shadow: 1px 1px 0 #000;
    max-width: 900px;
    margin: 0 auto;
  }

  .titlebar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    font-size: 11px;
    padding: 3px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .titlebar-left { display: flex; align-items: center; gap: 4px; }
  .titlebar-icon { width: 16px; height: 16px; image-rendering: pixelated; }
  .titlebar-btn {
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #808080 #808080 #fff;
    width: 16px; height: 14px;
    font-size: 10px; font-weight: bold;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #000;
    margin-left: 2px;
  }

  .window-body { padding: 12px; }

  /* ── Filename input row ── */
  .input-row {
    display: flex; align-items: center; gap: 6px;
    background: #fff;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 6px 8px;
    margin-bottom: 12px;
  }
  .input-row label { white-space: nowrap; color: #000; font-weight: bold; }
  .input-row input {
    flex: 1;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    background: #fff;
    padding: 2px 4px;
    font-family: inherit;
    font-size: 11px;
  }
  .input-row button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 2px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .input-row button:active {
    border-color: #808080 #fff #fff #808080;
  }

  /* ── Divider ── */
  .divider {
    border: none; border-top: 1px solid #808080;
    border-bottom: 1px solid #fff;
    margin: 10px 0;
  }

  /* ── Section title ── */
  .section-title {
    font-weight: bold; color: #000080;
    margin-bottom: 8px; font-size: 11px;
    display: flex; align-items: center; gap: 4px;
  }
  .section-title::before {
    content: "";
    display: inline-block;
    width: 2px; height: 12px;
    background: #000080;
  }

  /* ── Grid of preview cards ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }

  .card {
    background: #fff;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }

  .card-label {
    font-size: 10px; color: #000; font-weight: bold; text-align: center;
    line-height: 1.3;
  }
  .card-sub { font-size: 9px; color: #444; margin-top: -4px; text-align: center; }

  .icon-box {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #c0c0c0;
    background: #f0f0f0;
    position: relative;
  }
  .icon-box img { display: block; }

  /* rendering variants */
  .px  { image-rendering: pixelated; }
  .sm  { image-rendering: smooth; }
  .aa  { image-rendering: auto; }

  /* ── Comparison row (pixelated vs smooth side by side) ── */
  .compare-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .compare-card {
    flex: 1; min-width: 120px;
    background: #fff;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }

  /* ── Context preview ── */
  .ctx-row {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start;
    margin-bottom: 12px;
  }
  .ctx-box {
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 6px 10px;
    background: #c0c0c0;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #000;
    cursor: pointer;
    white-space: nowrap;
  }
  .ctx-box:hover { background: #000080; color: #fff; }

  .ctx-box-titlebar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    border-color: #fff #808080 #808080 #fff;
    padding: 3px 6px;
    font-weight: bold;
    font-size: 11px;
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }

  .ctx-kpi {
    background: #fff;
    border: 2px inset #c0c0c0;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    min-width: 130px;
  }
  .ctx-kpi-text { line-height: 1.5; }
  .ctx-kpi-val { font-weight: bold; font-size: 13px; color: #000080; }
  .ctx-kpi-lbl { font-size: 10px; color: #555; }

  /* ── Status bar ── */
  .statusbar {
    background: #c0c0c0;
    border-top: 1px solid #808080;
    padding: 3px 8px;
    font-size: 10px; color: #000;
    display: flex; gap: 12px;
  }
  .statusbar span {
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 1px 4px;
  }

  /* ── Pixel grid overlay toggle ── */
  .show-grid .icon-box {
    background-image:
      linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px);
  }

  /* Highlight border for selected rendering */
  .highlight-card { outline: 2px solid #000080; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="titlebar-left">
      <img id="title-icon" src="assets/house.png" class="titlebar-icon" alt="">
      <span>Тестер іконок — УкрДані</span>
    </div>
    <div style="display:flex">
      <div class="titlebar-btn">_</div>
      <div class="titlebar-btn">□</div>
      <div class="titlebar-btn">✕</div>
    </div>
  </div>

  <div class="window-body">

    <!-- Filename input -->
    <div class="input-row">
      <label>Файл іконки:</label>
      <input type="text" id="icon-path" value="assets/house.png" placeholder="assets/house.png" />
      <button onclick="applyIcon()">▶ Застосувати</button>
      <button onclick="toggleGrid()">⊞ Сітка</button>
    </div>

    <hr class="divider">

    <!-- SECTION 1: Sizes -->
    <div class="section-title">1. Розміри (використані в УкрДаних)</div>
    <div class="grid" id="size-grid">
      <!-- Filled by JS -->
    </div>

    <hr class="divider">

    <!-- SECTION 2: Rendering comparison at 32px -->
    <div class="section-title">2. Порівняння image-rendering при 32px</div>
    <div class="compare-row" id="render-compare">
      <!-- Filled by JS -->
    </div>

    <hr class="divider">

    <!-- SECTION 3: Context previews -->
    <div class="section-title">3. Контекстний вигляд</div>
    <div class="ctx-row" id="ctx-row">
      <!-- Filled by JS -->
    </div>

  </div>

  <div class="statusbar">
    <span id="status-path">assets/house.png</span>
    <span id="status-size">16px → 48px</span>
    <span>image-rendering: pixelated</span>
  </div>
</div>

<script>
  const SIZES = [
    { label: "Titlebar", size: 16, desc: "навбар / вікно" },
    { label: "Навігація", size: 20, desc: "бокова панель" },
    { label: "Кнопки", size: 24, desc: "toolbar-кнопки" },
    { label: "Категорія", size: 32, desc: "cat-card іконка" },
    { label: "KPI карта", size: 40, desc: "блок статистики" },
    { label: "Великий", size: 48, desc: "hero / заголовок" },
  ];

  const RENDERS = [
    { label: "pixelated", cls: "px", desc: "Чіткі пікселі, без згладжування" },
    { label: "smooth", cls: "sm", desc: "Повне згладжування" },
    { label: "auto", cls: "aa", desc: "Браузер вирішує сам" },
  ];

  let currentPath = "assets/house.png";
  let gridOn = false;

  function applyIcon() {
    currentPath = document.getElementById("icon-path").value.trim();
    document.getElementById("status-path").textContent = currentPath;
    document.getElementById("title-icon").src = currentPath;
    renderAll();
  }

  function toggleGrid() {
    gridOn = !gridOn;
    document.querySelectorAll(".icon-box").forEach(b => {
      if (gridOn) {
        const sz = parseInt(b.dataset.size);
        b.style.backgroundSize = `${sz}px ${sz}px`;
        b.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px)`;
      } else {
        b.style.backgroundImage = "";
        b.style.backgroundSize = "";
      }
    });
  }

  function makeImg(src, size, renderCls) {
    const img = document.createElement("img");
    img.src = src;
    img.width = size;
    img.height = size;
    img.alt = "";
    if (renderCls) img.className = renderCls;
    return img;
  }

  function makeSizeCard(s) {
    const card = document.createElement("div");
    card.className = "card";

    const lbl = document.createElement("div");
    lbl.className = "card-label";
    lbl.textContent = `${s.label} — ${s.size}px`;
    card.appendChild(lbl);

    const sub = document.createElement("div");
    sub.className = "card-sub";
    sub.textContent = s.desc;
    card.appendChild(sub);

    // Show both pixelated and smooth side by side
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;align-items:center;";

    ["px", "sm"].forEach((cls, i) => {
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px;";

      const box = document.createElement("div");
      box.className = "icon-box";
      box.dataset.size = s.size;
      box.style.width = (s.size + 8) + "px";
      box.style.height = (s.size + 8) + "px";

      const img = makeImg(currentPath, s.size, cls);
      box.appendChild(img);
      wrap.appendChild(box);

      const rlbl = document.createElement("div");
      rlbl.style.cssText = "font-size:9px;color:#555;text-align:center;";
      rlbl.textContent = cls === "px" ? "pixelated" : "smooth";
      wrap.appendChild(rlbl);

      row.appendChild(wrap);
    });

    card.appendChild(row);
    return card;
  }

  function makeRenderCard(r) {
    const card = document.createElement("div");
    card.className = "compare-card";

    const lbl = document.createElement("div");
    lbl.className = "card-label";
    lbl.textContent = `image-rendering: ${r.label}`;
    card.appendChild(lbl);

    const sub = document.createElement("div");
    sub.className = "card-sub";
    sub.style.marginBottom = "6px";
    sub.textContent = r.desc;
    card.appendChild(sub);

    // Show 16, 24, 32, 48 in this rendering
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center;";

    [16, 24, 32, 48].forEach(sz => {
      const wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px;";

      const box = document.createElement("div");
      box.className = "icon-box";
      box.dataset.size = sz;
      box.style.width = (sz + 6) + "px";
      box.style.height = (sz + 6) + "px";

      const img = makeImg(currentPath, sz, r.cls);
      box.appendChild(img);
      wrap.appendChild(box);

      const sl = document.createElement("div");
      sl.style.cssText = "font-size:9px;color:#555;";
      sl.textContent = sz + "px";
      wrap.appendChild(sl);

      row.appendChild(wrap);
    });

    card.appendChild(row);
    return card;
  }

  function makeCtxPreviews() {
    const row = document.getElementById("ctx-row");
    row.innerHTML = "";

    // Titlebar
    const tb = document.createElement("div");
    tb.className = "ctx-box-titlebar";
    const tbImg = makeImg(currentPath, 16, "px");
    tb.appendChild(tbImg);
    tb.appendChild(document.createTextNode(" УкрДані — Заголовок вікна"));
    row.appendChild(tb);

    // Nav button
    const nav = document.createElement("div");
    nav.className = "ctx-box";
    const navImg = makeImg(currentPath, 20, "px");
    nav.appendChild(navImg);
    nav.appendChild(document.createTextNode("Навігація"));
    row.appendChild(nav);

    // Toolbar button 24px
    const tb24 = document.createElement("div");
    tb24.className = "ctx-box";
    const tb24img = makeImg(currentPath, 24, "px");
    tb24.appendChild(tb24img);
    tb24.appendChild(document.createTextNode("Кнопка"));
    row.appendChild(tb24);

    // Category card 32px
    const cat = document.createElement("div");
    cat.style.cssText = "background:#fff;border:2px inset #c0c0c0;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:90px;";
    const catImg = makeImg(currentPath, 32, "px");
    cat.appendChild(catImg);
    const catLbl = document.createElement("div");
    catLbl.style.cssText = "font-size:10px;color:#000080;font-weight:bold;text-align:center;";
    catLbl.textContent = "Категорія";
    cat.appendChild(catLbl);
    row.appendChild(cat);

    // KPI card 40px
    const kpi = document.createElement("div");
    kpi.className = "ctx-kpi";
    const kpiImg = makeImg(currentPath, 40, "px");
    kpi.appendChild(kpiImg);
    const kpiText = document.createElement("div");
    kpiText.className = "ctx-kpi-text";
    kpiText.innerHTML = `<div class="ctx-kpi-val">3 247</div><div class="ctx-kpi-lbl">Одиниць даних</div>`;
    kpi.appendChild(kpiText);
    row.appendChild(kpi);
  }

  function renderAll() {
    // Size grid
    const sg = document.getElementById("size-grid");
    sg.innerHTML = "";
    SIZES.forEach(s => sg.appendChild(makeSizeCard(s)));

    // Render compare
    const rc = document.getElementById("render-compare");
    rc.innerHTML = "";
    RENDERS.forEach(r => rc.appendChild(makeRenderCard(r)));

    // Context
    makeCtxPreviews();

    // Update title icon
    document.getElementById("title-icon").src = currentPath;
    document.getElementById("status-path").textContent = currentPath;

    // Re-apply grid if on
    if (gridOn) { gridOn = false; toggleGrid(); }
  }

  // Enter key support
  document.getElementById("icon-path").addEventListener("keydown", e => {
    if (e.key === "Enter") applyIcon();
  });

  // Init
  renderAll();
</script>
</body>
</html>
